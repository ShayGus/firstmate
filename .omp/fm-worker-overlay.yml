# Firstmate worker posture for omp (Oh My Pi), passed as `--config` on every
# Firstmate-launched omp session (crewmate, scout, and secondmate alike) by
# bin/fm-spawn.sh, whose header owns why the launch carries it. It is the omp
# analogue of the Pi adapter's `--tui-mode regular` pin: a per-launch overlay,
# never a write to the captain's own ~/.omp/agent/config.yml, which stays
# exactly as the captain set it (model roles, theme, providers, compaction).
# Each key below pins one setting whose captain-facing value would park an
# unattended worker on an interactive prompt, change its pinned model under it,
# or make its composer unreadable to bin/fm-composer-lib.sh. Verified against
# omp 18.1.11's own settings schema (`omp config list`).
composer:
  # Renders a bare `❯` (U+276F) row, a glyph the shared composer classifier
  # already reads; the shipped default `band` and six other shapes are not in
  # its catalogue, and the shape is otherwise a captain-level setting.
  shape: borderless
plan:
  # `plan.defaultOnStartup: true` opens every session read-only; a worker that
  # cannot edit files sits on its brief forever.
  defaultOnStartup: false
prewalk:
  # Prewalk swaps the active model for the `smol` role after the first edit, so
  # a worker pinned with --model would silently change model mid-task.
  enabled: false
retry:
  # `confirm` pops a dialog when a usage window runs low; `auto` lets omp fall
  # through the captain's own fallback chain without a keystroke.
  usageReservePolicy: auto
task:
  # An omp ship task is a durable coordinator (docs/subagent-guard.md): it
  # hands implementation to one named child, so at most one task child may run
  # at a time, the child must never fan out into a grandchild, and the child
  # writes the task's existing worktree rather than an isolated copy. The
  # per-task extension in state/<id>.omp-ext.ts enforces which agent that one
  # item names; these three keys make the shape mechanically impossible to
  # widen. Verified against omp 18.1.11's and 18.2.6's own settings schema
  # (`omp config list`) and live against omp 18.2.6: maxRecursionDepth is the
  # total child depth the session may create, so 1 means the coordinator can
  # spawn exactly its implementation child and that child can spawn nothing
  # (0 removes the task tool from the coordinator entirely, live-verified
  # 2026-09-19), maxConcurrency defaults to 32 and is pinned to one, and
  # isolation.enabled defaults to false but is pinned so a captain's own true
  # setting cannot divert the one child into a hidden worktree.
  maxConcurrency: 1
  maxRecursionDepth: 1
  isolation:
    enabled: false
